image: ompcluster/runtime:latest

variables:
  DEFAULT_FEATURES: 0 #  specify explicit what to use in each build
  CC: clang
  CXX: clang++

test-mpi:
  variables:
    CC: mpicc
    CXX: mpicxx
    TASKBENCH_USE_MPI: 1
  script:
    - ./get_deps.sh
    - ./build_all.sh
    - ./test_all.sh

test-mpi-openmp:
  variables:
    CC: mpicc
    CXX: mpicxx
    USE_MPI_OPENMP: 1
  script:
    - ./get_deps.sh
    - ./build_all.sh
    - ./test_all.sh

test-openmp:
  variables:
    USE_OPENMP: 1
  script:
    - ./get_deps.sh
    - ./build_all.sh
    - ./test_all.sh

test-ompcluster:
  variables:
    USE_OMPCLUSTER: 1
  script:
    - ./get_deps.sh
    - ./build_all.sh
    - ./test_all.sh
