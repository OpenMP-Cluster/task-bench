name: TaskBench CI (OMPC CPU)

on:
  workflow_dispatch:
  push:
    branches: [ci-scheduling-tests]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build TaskBench CPU
    runs-on: [self-hosted, ompc-ci]
    timeout-minutes: 120

    container:
      image: docker.io/orenaud809/ompc:cuda-ompc

    env:
      DEFAULT_FEATURES: "0"
      USE_OMPCLUSTER: "1"
      USE_MPI_OPENMP: "0"
      CUDA: "0"
      CC: clang
      CXX: clang++
      THREADS: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OMPC toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          mpicxx -show
          test -f "$OMPC_RUNTIMES_BUILD/openmp/runtime/src/libomp.so"

      - name: Build TaskBench core
        shell: bash
        run: make -C core -j4 CC=clang CXX=clang++

      - name: Build TaskBench OMPC
        shell: bash
        run: make -C ompcluster -j4 CXX=clang++ CUDA=0

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          test -x ompcluster/main
          test -x ompcluster/main_no_datamap
          test -x ompcluster/main_multidevice

      - name: Smoke test DMDAS TDG
        shell: bash
        run: |
          set -euo pipefail
          unset OMPCLUSTER_SCHEDULER
          unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
          export OMPCLUSTER_RUNTIME=dmdas
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export LIBOMPTARGET_DEBUG=1
          export LIBOMPTARGET_INFO=-1
          export OMP_TARGET_OFFLOAD=MANDATORY

          timeout 60s mpirun -np 2 llvm-offload-mpi-proxy-device : -np 1 ./ompcluster/main -steps 4 -width 4 -type trivial -kernel compute_bound -iter 1000 2>&1 | tee dmdas-tdg.log
          grep -q 'Elapsed Time' dmdas-tdg.log

      - name: Smoke test DMDAS no TDG
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
          unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
          export OMPCLUSTER_RUNTIME=dmdas
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY
          export LIBOMPTARGET_DEBUG=1
          export LIBOMPTARGET_INFO=4

          timeout 60s mpirun -np 2 llvm-offload-mpi-proxy-device : -np 1 ./ompcluster/main_no_datamap -steps 4 -width 4 -type trivial -kernel compute_bound -iter 1000 2>&1 | tee dmdas-no-tdg.log
          grep -q 'Elapsed Time' dmdas-no-tdg.log

      - name: Smoke test Legacy HEFT TDG
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
          unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
          export OMPCLUSTER_SCHEDULER=heft_legacy
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY
          export LIBOMPTARGET_DEBUG=1
          export LIBOMPTARGET_INFO=4

          timeout 60s mpirun -np 2 llvm-offload-mpi-proxy-device : -np 1 ./ompcluster/main -steps 4 -width 4 -type trivial -kernel compute_bound -iter 1000 2>&1 | tee legacy-heft-tdg.log
          grep -q 'Elapsed Time' legacy-heft-tdg.log

      - name: Smoke test Legacy HEFT no TDG
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
          unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
          export OMPCLUSTER_SCHEDULER=heft_legacy
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY
          export LIBOMPTARGET_DEBUG=1
          export LIBOMPTARGET_INFO=4

          timeout 60s mpirun -np 2 llvm-offload-mpi-proxy-device : -np 1 ./ompcluster/main_no_datamap -steps 4 -width 4 -type trivial -kernel compute_bound -iter 1000 2>&1 | tee legacy-heft-no-tdg.log
          grep -q 'Elapsed Time' legacy-heft-no-tdg.log

      - name: Smoke test HEFT TDG
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          unset OMPCLUSTER_RUNTIME OMPCLUSTER_SCHEDULER
          unset OMPCLUSTER_PERF_MODEL_DIR OMPCLUSTER_PERF_MODEL_TRAINING OMPCLUSTER_PERF_SAMPLES
          export OMPCLUSTER_SCHEDULER=heft
          export OMPCLUSTER_TASKBENCH_ITERATION_NUMBER=1
          export OMP_NUM_THREADS=4
          export LIBOMP_NUM_HIDDEN_HELPER_THREADS=4
          export OMPCLUSTER_NUM_EXEC_EVENT_HANDLERS=2
          export UCX_TLS=self,sysv,tcp
          export OMP_TARGET_OFFLOAD=MANDATORY
          export LIBOMPTARGET_DEBUG=1
          export LIBOMPTARGET_INFO=4

          timeout 60s mpirun -np 2 llvm-offload-mpi-proxy-device : -np 1 ./ompcluster/main -steps 4 -width 4 -type trivial -kernel compute_bound -iter 1000 2>&1 | tee heft-tdg.log
          grep -q 'Elapsed Time' heft-tdg.log
